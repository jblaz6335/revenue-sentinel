<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Revenue Sentinel architecture</title>
  <desc id="desc">Evidence-first autonomous opportunity auditing with Google ADK, Gemini, Cloud Run, Firestore, and deterministic policy gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101e"/><stop offset="1" stop-color="#0c2033"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#67e8f9"/></marker>
    <style>
      .title{font:700 52px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 23px Inter,Segoe UI,sans-serif;fill:#a9bdd4}
      .eyebrow{font:700 17px Inter,Segoe UI,sans-serif;letter-spacing:3px;fill:#67e8f9}.box{fill:#0e2238;stroke:#2d4964;stroke-width:2;filter:url(#shadow)}
      .boxTitle{font:700 25px Inter,Segoe UI,sans-serif;fill:#f8fafc}.boxText{font:400 18px Inter,Segoe UI,sans-serif;fill:#b8c8dc}
      .badge{fill:#102f48;stroke:#22d3ee;stroke-width:1.5}.badgeText{font:700 16px Inter,Segoe UI,sans-serif;fill:#67e8f9}
      .flow{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}.gate{fill:#15291f;stroke:#34d399;stroke-width:2;filter:url(#shadow)}
      .warn{fill:#302112;stroke:#f59e0b;stroke-width:2;filter:url(#shadow)}.small{font:400 15px Inter,Segoe UI,sans-serif;fill:#8197af}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="84" class="eyebrow">GOOGLE ADK · GEMINI 3.5 FLASH · CLOUD RUN</text>
  <text x="90" y="146" class="title">Revenue Sentinel</text>
  <text x="90" y="188" class="subtitle">Autonomous opportunity triage with a deterministic evidence boundary</text>

  <rect x="90" y="270" rx="18" ry="18" width="275" height="180" class="box"/>
  <text x="120" y="318" class="boxTitle">Opportunity intake</text>
  <text x="120" y="357" class="boxText">Public source</text><text x="120" y="385" class="boxText">Budget + deadline</text>
  <text x="120" y="413" class="boxText">Eligibility + scope</text>
  <rect x="120" y="230" rx="13" width="128" height="30" class="badge"/><text x="140" y="251" class="badgeText">UNTRUSTED</text>

  <rect x="445" y="250" rx="18" ry="18" width="330" height="220" class="box"/>
  <text x="475" y="300" class="boxTitle">Google ADK agent</text>
  <text x="475" y="340" class="boxText">Gemini orchestrates tools</text><text x="475" y="370" class="boxText">Clarifies missing evidence</text>
  <text x="475" y="400" class="boxText">Creates owner-ready brief</text>
  <rect x="475" y="420" rx="13" width="210" height="30" class="badge"/><text x="493" y="441" class="badgeText">NO DIRECT WRITES</text>

  <rect x="855" y="230" rx="18" ry="18" width="380" height="260" class="gate"/>
  <text x="885" y="282" class="boxTitle">Deterministic policy gate</text>
  <text x="885" y="322" class="boxText">HTTPS source + deadline</text><text x="885" y="352" class="boxText">Eligibility + payment protection</text>
  <text x="885" y="382" class="boxText">Scope + budget clarity</text><text x="885" y="412" class="boxText">Risk + expected value</text>
  <rect x="885" y="438" rx="13" width="252" height="30" class="badge"/><text x="903" y="459" class="badgeText">MODEL CANNOT OVERRIDE</text>

  <rect x="1315" y="270" rx="18" ry="18" width="205" height="180" class="box"/>
  <text x="1345" y="318" class="boxTitle">Action queue</text>
  <text x="1345" y="357" class="boxText">Ready</text><text x="1345" y="385" class="boxText">Review</text>
  <text x="1345" y="413" class="boxText">Table / reject</text>

  <path d="M365 360H435" class="flow"/><path d="M775 360H845" class="flow"/><path d="M1235 360H1305" class="flow"/>

  <rect x="350" y="590" rx="18" ry="18" width="350" height="165" class="box"/>
  <text x="380" y="642" class="boxTitle">Cloud Run API</text>
  <text x="380" y="681" class="boxText">FastAPI · typed validation</text><text x="380" y="711" class="boxText">Health, audit, batch, demo</text>

  <rect x="850" y="590" rx="18" ry="18" width="350" height="165" class="box"/>
  <text x="880" y="642" class="boxTitle">Firestore evidence</text>
  <text x="880" y="681" class="boxText">Digest-addressed records</text><text x="880" y="711" class="boxText">Auditable decision history</text>
  <path d="M610 480V580" class="flow"/><path d="M775 672H840" class="flow"/>

  <rect x="90" y="800" rx="14" ry="14" width="1430" height="58" class="warn"/>
  <text x="120" y="836" class="boxText">External submission, messaging, payment, deployment, or account mutation stays behind an explicit owner gate.</text>
  <text x="1390" y="836" class="small">v0.1</text>
</svg>
